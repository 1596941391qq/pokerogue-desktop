name: build

# Push a tag like pokerogue20261109 (after creating its GitHub release) to build and attach:
#   prsYYMMDD-portable.exe, prsYYMMDD-pc.zip (Windows x64) and prsYYMMDD-mac-arm64.dmg.
# Manual runs build the same files as workflow artifacts only; pick "windows" to skip the
# (10x billed on private repos) macOS runner.
on:
  push:
    tags: ['pokerogue*']
  workflow_dispatch:
    inputs:
      platforms:
        description: which builds
        type: choice
        options: [all, windows, mac]
        default: all

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platforms != 'mac'
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Release tag
        run: |
          if [[ "$GITHUB_REF_NAME" == pokerogue* ]]; then d="${GITHUB_REF_NAME#pokerogue}"; echo "PRS_TAG=${d:2}" >> "$GITHUB_ENV";
          else echo "PRS_TAG=dev$(date +%y%m%d)" >> "$GITHUB_ENV"; fi
      - run: npm ci
      - run: bash scripts/fetch-game.sh
      - run: npx electron-builder --win portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'release/*.exe', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: windows-zip, path: 'release/*.zip', retention-days: 7, compression-level: 0 }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/pokerogue')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.zip --clobber

  mac:
    if: github.event_name == 'push' || inputs.platforms != 'windows'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Release tag
        run: |
          if [[ "$GITHUB_REF_NAME" == pokerogue* ]]; then d="${GITHUB_REF_NAME#pokerogue}"; echo "PRS_TAG=${d:2}" >> "$GITHUB_ENV";
          else echo "PRS_TAG=dev$(date +%y%m%d)" >> "$GITHUB_ENV"; fi
      - run: npm ci
      - run: bash scripts/fetch-game.sh
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: 'release/*.dmg', retention-days: 7, compression-level: 0 }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/pokerogue')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$GITHUB_REF_NAME" release/*.dmg --clobber
