name: build

# Push a tag like pokerogue20261109 (after creating its GitHub release) to build and attach:
#   prsYYMMDD-portable.exe, prsYYMMDD-pc.zip (Windows x64) and prsYYMMDD-mac-arm64.dmg.
# Manual runs build the same files as workflow artifacts only.
on:
  push:
    tags: ['pokerogue*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable zip --x64
            files: release/*.exe release/*.zip
          - os: macos-15
            target: --mac dmg --arm64
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Release tag
        run: |
          if [[ "$GITHUB_REF_NAME" == pokerogue* ]]; then d="${GITHUB_REF_NAME#pokerogue}"; echo "PRS_TAG=${d:2}" >> "$GITHUB_ENV";
          else echo "PRS_TAG=dev$(date +%y%m%d)" >> "$GITHUB_ENV"; fi
      - run: npm ci
      - name: Fetch the game build (pinned in game-version.json)
        run: bash scripts/fetch-game.sh
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 7
          compression-level: 0
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/pokerogue')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
